<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Случайная сумма</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .box {
      text-align: center;
    }
    .label {
      font-size: 1.3rem;
      color: #8892b0;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }
    #number {
      font-size: clamp(4rem, 20vw, 12rem);
      font-weight: 800;
      background: linear-gradient(90deg, #00d2ff, #3a7bd5);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="label">Остаток на счёте</div>
    <div id="number">0</div>
  </div>

  <script>
    const min = 1;
    const max = 450;
    const random = Math.floor(Math.random() * (max - min + 1)) + min;
    document.getElementById('number').textContent = random + ' BYN';
  </script>
</body>
</html>
